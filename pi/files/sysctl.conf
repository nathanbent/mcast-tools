# Installed by mcast-tools/pi/install.sh as /etc/sysctl.d/60-mcast.conf.

# The monitor joins every SAP-announced stream; the default limit is 20 groups.
net.ipv4.igmp_max_memberships = 256
net.ipv6.mld_max_msf = 256

# mcast asks for a 1 MiB receive buffer; the default cap is ~208 KiB, which
# can drop packets on bursts of high-rate L16/L24 streams.
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304

# Loose reverse-path filtering, so multicast from sources on other subnets
# (or reached through a VLAN interface) isn't silently dropped.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
