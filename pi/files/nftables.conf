#!/usr/sbin/nft -f
# Installed by mcast-tools/pi/install.sh as /etc/nftables.conf.
# The TCP ports come from pi.conf. LLDP/CDP are layer 2 and not
# affected by this ruleset.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif lo accept

        # Ping, path MTU discovery, IPv6 neighbor discovery.
        meta l4proto { icmp, ipv6-icmp } accept
        # IGMP queries from the switch/querier, so group memberships stay up.
        ip protocol igmp accept

        # DHCP and DHCPv6 replies.
        udp dport 68 accept
        ip6 saddr fe80::/10 udp dport 546 accept

        # mDNS (hostname.local) and SAP announcements.
        udp dport { 5353, 9875 } accept

        # Any UDP sent to a multicast group: RTP streams to receive and monitor.
        ip daddr 224.0.0.0/4 meta l4proto udp accept
        ip6 daddr ff00::/8 meta l4proto udp accept

        # SSH and the web services this build runs.
        tcp dport { @TCP_PORTS@ } accept

        # Anything arriving over Tailscale is already authenticated.
        iifname "tailscale0" accept
        udp dport 41641 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }
}
