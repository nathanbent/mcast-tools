# Installed by mcast-tools/pi/install.sh as /etc/lldpd.d/mcast.conf.
# The description and interface pattern come from pi.conf.
configure system description "@DESCRIPTION@"
configure system interface pattern @INTERFACES@
configure lldp portidsubtype ifname
configure lldp tx-interval 30
# LLDP-MED: let VoIP-aware switches see it quickly after link up.
configure med fast-start enable
