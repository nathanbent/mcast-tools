[package]
name = "mcast-intercom"
description = "Intercom control panel for mcast serve: zones, announcements, play now (a client of the HTTP API)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Only talks to `mcast serve` over HTTP: no dependency on the other mcast
# crates, so it can move out of this workspace on its own.
[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
futures-util.workspace = true
jiff = "0.2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ureq = { version = "2", features = ["json"] }
# HTTPS for the panel (browsers only allow the microphone on HTTPS pages).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Access tokens: random secrets and their SHA-256 (already in the tree through rustls).
ring = "0.17"

[dev-dependencies]
hound.workspace = true
tower.workspace = true
tokio-tungstenite = "0.29"
mcast-core.workspace = true
mcast-server.workspace = true
