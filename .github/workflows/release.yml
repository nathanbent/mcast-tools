name: Release

# Builds mcast for each platform and publishes a GitHub release with the
# binaries, either when a tag like v0.2.0 is pushed, or when the workflow is
# run by hand from main with a tag name (it then creates the tag itself, on
# the commit it built). Every build must pass before anything is published.
# On pull requests that touch this file, and on manual runs with no tag, it
# only builds, so the builds can be checked first.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Tag to release from main, e.g. v0.2.0 (must match the version in Cargo.toml). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Works out which tag (if any) this run releases, and refuses bad requests
  # before the slow builds start.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        name: Check the release request
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release }}
        run: |
          tag=$(echo "$REQUESTED" | xargs)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          [ -z "$tag" ] && { echo "Build only; nothing will be published."; exit 0; }
          version=$(cargo pkgid -p mcast | sed 's/.*[#@]//')
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag doesn't match version $version in Cargo.toml"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Releases can only be made from main (this run is on $GITHUB_REF_NAME)"
              exit 1
            fi
            # An existing tag must already point at this commit.
            # (ls-remote prints nothing for a missing tag, and fails the job if
            # it can't reach the repo; an annotated tag's commit is the ^{} line.)
            refs=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
            existing=$(echo "$refs" | tail -n1 | cut -f1)
            if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag already exists on another commit ($existing)"
              exit 1
            fi
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists"
            exit 1
          fi
          echo "Will release $tag from $GITHUB_SHA."

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 so the binaries run on glibc 2.35 and newer.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          # Apple silicon runner; the Intel build is cross-compiled.
          # MACOSX_DEPLOYMENT_TARGET (below) keeps the binaries running on
          # macOS 11+, whichever macOS the runner has.
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      # Build libopus from the bundled source and link it in, so the binaries
      # don't need libopus installed. (ALSA stays a shared library on Linux.)
      LIBOPUS_STATIC: "1"
      LIBOPUS_NO_PKG: "1"
      # libopus's bundled CMakeLists asks for CMake 3.1, which CMake 4 (on the
      # Windows and macOS runners) refuses without this.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      # Oldest macOS the binaries support, for Rust and the C code alike
      # (otherwise C is built for the runner's own macOS version).
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Tells the binary it's a release build, so `mcast update` downloads
      # releases instead of building from source.
      MCAST_RELEASE: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p mcast --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir dist
          dir=target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = Windows ]; then
            7z a "dist/mcast-${{ matrix.target }}.zip" "./$dir/mcast.exe"
          else
            tar -czf "dist/mcast-${{ matrix.target }}.tar.gz" -C "$dir" mcast
          fi
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: target/${{ matrix.target }}/release/mcast --version
      - uses: actions/upload-artifact@v4
        with:
          name: mcast-${{ matrix.target }}
          path: dist/*

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      # Creates the tag on the built commit if it doesn't exist yet (manual
      # runs); a pushed tag already does. A tag made with this token doesn't
      # start the workflow again.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: >
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "$TAG" --generate-notes
