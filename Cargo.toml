[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.5.7"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
cpal = "0.15"
axum = "0.8"
# termination: SIGTERM (systemd, docker stop) stops a command cleanly, as Ctrl-C does.
ctrlc = { version = "3", features = ["termination"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hound = "3.5"
opus = "0.3"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "io-util", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
rustfft = "6"
symphonia = { version = "0.5", features = ["all"] }
libc = "0.2"
socket2 = { version = "0.5", features = ["all"] }
mcast-core = { path = "crates/mcast-core" }
mcast-audio = { path = "crates/mcast-audio" }
mcast-monitor = { path = "crates/mcast-monitor" }
mcast-control = { path = "crates/mcast-control" }
mcast-server = { path = "crates/mcast-server" }
mcast-web = { path = "crates/mcast-web" }
mcast-tui = { path = "crates/mcast-tui" }
mcast-intercom = { path = "crates/mcast-intercom" }
mcast-text = { path = "crates/mcast-text" }
mcast-file = { path = "crates/mcast-file" }
raptorq = "2"
crc32fast = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[profile.release]
# Whole-program optimisation: slower builds, faster and smaller binaries.
lto = "fat"
codegen-units = 1
strip = true
