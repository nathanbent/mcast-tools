[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
ctrlc = "3"
hound = "3.5"
opus = "0.3"
rtrb = "0.4"
rustfft = "6"
symphonia = { version = "0.5", features = ["all"] }
libc = "0.2"
socket2 = { version = "0.5", features = ["all"] }
mcast-core = { path = "crates/mcast-core" }
mcast-audio = { path = "crates/mcast-audio" }
mcast-monitor = { path = "crates/mcast-monitor" }

[profile.release]
# Whole-program optimisation: slower builds, faster and smaller binaries.
lto = "fat"
codegen-units = 1
strip = true
